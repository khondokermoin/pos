services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudpos_app:local
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - app_storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis

  web:
    image: nginx:stable
    ports:
      - 8080:80
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloudpos
      MYSQL_USER: cloudpos
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  node:
    build:
      context: .
      dockerfile: Dockerfile.assets
    image: cloudpos_node:local
    working_dir: /app
    command: ["npm", "run", "build"]

  queue:
    image: cloudpos_app:local
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - redis
      - db
    volumes:
      - ./:/var/www/html:cached
      - app_storage:/var/www/html/storage

volumes:
  db_data:
  redis_data:
  app_storage:
